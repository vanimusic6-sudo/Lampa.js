name: Build CAPSULE Trailer Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "tmp/**"
    paths:
      - "bridge/**"
      - ".github/workflows/build-trailer-bridge.yml"

jobs:
  windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Build Windows bridge
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ../CAPSULE-Trailer-Bridge.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: CAPSULE-Trailer-Bridge-windows-amd64
          path: CAPSULE-Trailer-Bridge.exe
